name: Build Patched Redsocks for OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            wget \
            xz-utils \
            git \
            file \
            python3

      - name: Download OpenWrt 19.07.10 SDK
        run: |
          wget -q --show-progress \
            https://archive.openwrt.org/releases/19.07.10/targets/ramips/mt76x8/openwrt-sdk-19.07.10-ramips-mt76x8_gcc-7.5.0_musl.Linux-x86_64.tar.xz

          tar -xf \
            openwrt-sdk-19.07.10-ramips-mt76x8_gcc-7.5.0_musl.Linux-x86_64.tar.xz

          mv \
            openwrt-sdk-19.07.10-ramips-mt76x8_gcc-7.5.0_musl.Linux-x86_64 \
            sdk

      - name: Configure OpenWrt feeds
        working-directory: sdk
        env:
          FORCE: "1"
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install libevent

      - name: Build libevent in SDK
        working-directory: sdk
        env:
          FORCE: "1"
        run: |
          make defconfig
          make package/libevent/compile V=s -j2

      - name: Download redsocks source
        run: |
          git clone https://github.com/darkk/redsocks.git
          cd redsocks

          git checkout release-0.5 || \
          git checkout v0.5 || \
          true

          echo "Original CONNECT code:"
          grep -n -A 5 -B 3 'CONNECT %s' http-connect.c

      - name: Patch HTTP CONNECT Host header
        run: |
          cd redsocks

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("http-connect.c")
          s = p.read_text()

          pattern = re.compile(
              r'len\s*=\s*evbuffer_add_printf'
              r'\(\s*buff\s*,\s*'
              r'"CONNECT %s:%u HTTP/1\.0\\r\\n"\s*,'
              r'\s*host\s*,\s*'
              r'ntohs\s*\(\s*destaddr->sin_port\s*\)\s*'
              r'\)\s*;',
              re.MULTILINE
          )

          replacement = '''len = evbuffer_add_printf(buff,
                  "CONNECT %s:%u HTTP/1.0\\r\\n"
                  "Host: %s:%u\\r\\n"
                  "\\r\\n",
                  host, ntohs(destaddr->sin_port),
                  host, ntohs(destaddr->sin_port));'''

          s2, count = pattern.subn(replacement, s, count=1)

          if count != 1:
              print("ERROR: CONNECT block could not be patched.")
              print()
              for i, line in enumerate(s.splitlines(), 1):
                  if "CONNECT %s" in line:
                      start = max(0, i - 4)
                      end = min(len(s.splitlines()), i + 6)
                      for n in range(start, end):
                          print(f"{n+1}: {s.splitlines()[n]}")
              raise SystemExit(1)

          p.write_text(s2)

          print("Patch successful.")
          PY

      - name: Verify Host patch
        run: |
          grep -n -A 10 -B 3 'CONNECT %s' redsocks/http-connect.c
          grep -n 'Host: %s' redsocks/http-connect.c

      - name: Locate OpenWrt toolchain and libevent
        run: |
          export STAGING_DIR="$GITHUB_WORKSPACE/sdk/staging_dir"

          echo "Toolchains:"
          find "$STAGING_DIR" -maxdepth 1 -type d -name 'toolchain-*' -print

          echo "event.h:"
          find "$STAGING_DIR" -name event.h -print

          echo "libevent:"
          find "$STAGING_DIR" -name 'libevent_core.so*' -print

      - name: Cross compile patched redsocks
        run: |
          export STAGING_DIR="$GITHUB_WORKSPACE/sdk/staging_dir"

          TOOLCHAIN="$STAGING_DIR/toolchain-mipsel_24kc_gcc-7.5.0_musl"
          TARGET="$STAGING_DIR/target-mipsel_24kc_musl"

          CC="$TOOLCHAIN/bin/mipsel-openwrt-linux-musl-gcc"
          STRIP="$TOOLCHAIN/bin/mipsel-openwrt-linux-musl-strip"

          test -x "$CC"
          test -x "$STRIP"
          test -f "$TARGET/usr/include/event.h"

          EVENTLIB="$(find "$TARGET/usr/lib" \
            -name 'libevent_core.so*' \
            -print -quit)"

          test -n "$EVENTLIB"

          echo "Compiler:"
          "$CC" --version

          echo "libevent:"
          echo "$EVENTLIB"

          cd redsocks

          make clean || true

          make \
            CC="$CC" \
            CFLAGS="-Os -I$TARGET/usr/include" \
            LDFLAGS="-L$TARGET/usr/lib" \
            LIBS="-levent_core"

          "$STRIP" redsocks

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp redsocks "$GITHUB_WORKSPACE/output/redsocks-patched"

      - name: Verify compiled binary
        run: |
          file output/redsocks-patched
          ls -lh output/redsocks-patched
          sha256sum output/redsocks-patched

          strings output/redsocks-patched | grep -A 2 'CONNECT %s' || true

      - name: Upload patched binary
        uses: actions/upload-artifact@v4
        with:
          name: redsocks-openwrt-mipsel-24kc
          path: output/redsocks-patched
          if-no-files-found: error
