name: Build Patched Redsocks OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build tools
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            ca-certificates \
            xz-utils \
            autoconf \
            automake \
            libtool \
            pkg-config \
            file \
            python3

      - name: Download OpenWrt SDK
        run: |
          set -euxo pipefail

          SDK_FILE="openwrt-sdk-19.07.10-ramips-mt76x8_gcc-7.5.0_musl.Linux-x86_64.tar.xz"

          wget \
            --tries=3 \
            --timeout=30 \
            --show-progress \
            "https://archive.openwrt.org/releases/19.07.10/targets/ramips/mt76x8/${SDK_FILE}" \
            -O sdk.tar.xz

          tar -xJf sdk.tar.xz

          mv \
            openwrt-sdk-19.07.10-ramips-mt76x8_gcc-7.5.0_musl.Linux-x86_64 \
            sdk

          test -d sdk/staging_dir

      - name: Setup MIPS toolchain
        run: |
          set -euxo pipefail

          TOOLCHAIN="$(find "$GITHUB_WORKSPACE/sdk/staging_dir" \
            -maxdepth 1 \
            -type d \
            -name 'toolchain-mipsel_24kc_gcc-7.5.0_musl*' \
            | head -n1)"

          test -n "$TOOLCHAIN"

          CC="$TOOLCHAIN/bin/mipsel-openwrt-linux-musl-gcc"
          AR="$TOOLCHAIN/bin/mipsel-openwrt-linux-musl-ar"
          RANLIB="$TOOLCHAIN/bin/mipsel-openwrt-linux-musl-ranlib"
          STRIP="$TOOLCHAIN/bin/mipsel-openwrt-linux-musl-strip"
          READELF="$TOOLCHAIN/bin/mipsel-openwrt-linux-musl-readelf"

          test -x "$CC"
          test -x "$AR"
          test -x "$RANLIB"
          test -x "$STRIP"
          test -x "$READELF"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "STAGING_DIR=$GITHUB_WORKSPACE/sdk/staging_dir" >> "$GITHUB_ENV"

          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "AR=$AR" >> "$GITHUB_ENV"
          echo "RANLIB=$RANLIB" >> "$GITHUB_ENV"
          echo "STRIP=$STRIP" >> "$GITHUB_ENV"
          echo "READELF=$READELF" >> "$GITHUB_ENV"

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          "$CC" --version

      - name: Download libevent 2.1.11
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch release-2.1.11-stable \
            https://github.com/libevent/libevent.git \
            libevent-src

          test -f libevent-src/include/event.h

      - name: Cross compile libevent
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/libevent-src"

          ./autogen.sh

          export CC="$CC"
          export AR="$AR"
          export RANLIB="$RANLIB"
          export STRIP="$STRIP"

          ./configure \
            --build="$(gcc -dumpmachine)" \
            --host=mipsel-openwrt-linux-musl \
            --disable-shared \
            --enable-static \
            --disable-openssl \
            --disable-samples \
            --disable-libevent-regress

          echo "=== GENERATE BUILT HEADERS ==="

          make -j1 include/event2/event-config.h

          test -f include/event2/event-config.h

          echo "=== EVENT CONFIG CREATED ==="
          ls -lh include/event2/event-config.h

          echo "=== BUILD LIBEVENT ==="

          make -j2

          test -f .libs/libevent_core.a

          echo "=== LIBEVENT OK ==="
          ls -lh .libs/libevent_core.a

      - name: Download redsocks 0.5
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch release-0.5 \
            https://github.com/darkk/redsocks.git \
            redsocks

          cd redsocks

          grep -n -A8 -B3 'CONNECT %s:%u' http-connect.c

      - name: Patch Host header
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/redsocks"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("http-connect.c")
          text = path.read_text()

          pattern = re.compile(
              r'len\s*=\s*evbuffer_add_printf\s*'
              r'\(\s*buff\s*,\s*'
              r'"CONNECT %s:%u HTTP/1\.0\\r\\n"\s*,\s*'
              r'inet_ntoa\s*\(\s*client->destaddr\.sin_addr\s*\)\s*,\s*'
              r'ntohs\s*\(\s*client->destaddr\.sin_port\s*\)\s*'
              r'\)\s*;',
              re.MULTILINE
          )

          replacement = '''len = evbuffer_add_printf(buff,
              "CONNECT %s:%u HTTP/1.0\\\\r\\\\n"
              "Host: %s:%u\\\\r\\\\n"
              "\\\\r\\\\n",
              inet_ntoa(client->destaddr.sin_addr),
              ntohs(client->destaddr.sin_port),
              inet_ntoa(client->destaddr.sin_addr),
              ntohs(client->destaddr.sin_port));'''

          patched, count = pattern.subn(
              lambda m: replacement,
              text,
              count=1
          )

          if count != 1:
              print("PATCH GAGAL: CONNECT block tidak ditemukan")

              lines = text.splitlines()

              for i, line in enumerate(lines, 1):
                  if "CONNECT %s:%u" in line:
                      start = max(1, i - 4)
                      end = min(len(lines), i + 8)

                      for n in range(start, end + 1):
                          print(f"{n}: {lines[n-1]}")

              raise SystemExit(1)

          path.write_text(patched)

          print("PATCH BERHASIL")
          PY

      - name: Verify patch
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/redsocks"

          grep -n -A10 -B3 'CONNECT %s:%u' http-connect.c
          grep -n 'Host: %s:%u' http-connect.c

      - name: Compile patched redsocks
        run: |
          set -euxo pipefail

          EVENT_DIR="$GITHUB_WORKSPACE/libevent-src"
          EVENT_LIB="$EVENT_DIR/.libs/libevent_core.a"

          test -f "$EVENT_DIR/include/event.h"
          test -f "$EVENT_DIR/include/event2/event-config.h"
          test -f "$EVENT_LIB"

          cd "$GITHUB_WORKSPACE/redsocks"

          make clean || true

          make \
            CC="$CC" \
            CFLAGS="-Os -ffunction-sections -fdata-sections -I$EVENT_DIR/include" \
            LDFLAGS="-Wl,--gc-sections" \
            LIBS="$EVENT_LIB"

          test -f redsocks

          "$STRIP" redsocks

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp redsocks \
            "$GITHUB_WORKSPACE/output/redsocks-patched"

      - name: Verify final binary
        run: |
          set -euxo pipefail

          BIN="$GITHUB_WORKSPACE/output/redsocks-patched"

          test -f "$BIN"

          echo "=== FILE ==="
          file "$BIN"

          echo "=== SIZE ==="
          ls -lh "$BIN"

          echo "=== SHA256 ==="
          sha256sum "$BIN"

          echo "=== ARCHITECTURE ==="
          file "$BIN" | grep -qi MIPS

          echo "=== HOST HEADER ==="
          strings "$BIN" | grep 'Host:'

          echo "=== ELF DEPENDENCIES ==="
          "$READELF" -d "$BIN" || true

      - name: Upload redsocks patched
        uses: actions/upload-artifact@v4
        with:
          name: redsocks-openwrt-mipsel-24kc
          path: output/redsocks-patched
          if-no-files-found: error
          retention-days: 7
